# ─────────────────────────────────────────────────────────────────────────────
# omen-clinic-agent — production Nginx site
#
#   Install as: /etc/nginx/sites-available/omen-clinic-agent.conf
#   Enable via: ln -s ../sites-available/omen-clinic-agent.conf /etc/nginx/sites-enabled/
#   (or drop straight into /etc/nginx/conf.d/omen-clinic-agent.conf)
#
# This file is included from the stock nginx.conf `http {}` block, so the
# upstream/map/limit_req_zone directives below are in http context — correct.
#
# BEFORE first `nginx -t`: the ssl_certificate paths must exist. Obtain the cert
# first (RUNBOOK §D: certbot certonly), or bootstrap HTTP-only, then enable this
# file. Replace every `agent.example.com` with the real clinic domain.
# ─────────────────────────────────────────────────────────────────────────────

# Node app (single fork instance — JSON file store; see ecosystem.config.cjs).
upstream omen_clinic_agent {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Rate-limit bucket for the webhook. Meta batches deliveries and can burst, so
# the sustained rate is modest but the burst is generous + nodelay so we never
# drop legitimate Meta traffic — this only throttles floods/scanners. Meta does
# not publish a stable IP allow-list, so we rate-limit rather than IP-filter.
limit_req_zone $binary_remote_addr zone=omen_webhook:10m rate=10r/s;

# ── HTTP :80 — ACME challenge + permanent redirect to HTTPS ──────────────────
server {
    listen 80;
    listen [::]:80;
    server_name agent.example.com;

    # Let's Encrypt HTTP-01 challenge (certbot --webroot -w /var/www/certbot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Everything else -> HTTPS. Meta requires a valid HTTPS webhook URL.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS :443 — the only public surface of the app ──────────────────────────
server {
    # HTTP/2 is enabled via the `listen` directive so this validates on stock
    # Ubuntu 22.04 (nginx 1.18) and 24.04 (nginx 1.24). The standalone
    # `http2 on;` directive only exists on nginx >= 1.25.1 and is a hard
    # `nginx -t` error on older builds — do not switch to it unless you install
    # nginx >= 1.25.1 from nginx.org. On 1.25.1+ this form still works (it just
    # logs a deprecation notice).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name agent.example.com;

    # Certbot-managed certificate (paths are placeholders — the domain dir is
    # created by `certbot certonly`). See RUNBOOK §D.
    ssl_certificate     /etc/letsencrypt/live/agent.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent.example.com/privkey.pem;

    # Self-contained modern TLS (does NOT depend on certbot's
    # options-ssl-nginx.conf snippet existing, so this file is portable).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:OmenTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # ── Security headers (apply to every response incl. errors) ──────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # This is a JSON API with no browser UI — lock the CSP all the way down.
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    # Meta webhook payloads are small JSON (inbound media is fetched separately
    # via the Graph API, never POSTed to us). Cap the body to reject junk.
    client_max_body_size 256k;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # Upstream acks fast (server.js returns 200 immediately, then processes
    # asynchronously), so these can be short.
    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 30s;

    access_log /var/log/nginx/omen-clinic-agent.access.log;
    error_log  /var/log/nginx/omen-clinic-agent.error.log warn;

    # ── /webhook — Meta verification (GET) + inbound messages (POST) ─────────
    # IMPORTANT: never rewrite/buffer-transform the request body here. The app
    # verifies Meta's X-Hub-Signature-256 HMAC over the RAW body; any mutation
    # breaks signature verification. Plain proxy_pass preserves the body.
    location = /webhook {
        limit_req zone=omen_webhook burst=30 nodelay;

        proxy_pass http://omen_clinic_agent;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering on;
    }

    # ── /health — liveness for uptime monitors and deploy.sh ─────────────────
    # NOTE: /health returns clinic names + phone_number_ids. If that is
    # sensitive, uncomment the allow/deny lines to restrict to your monitoring
    # IP(s) and localhost, and monitor externally with a blind TCP/443 check.
    location = /health {
        # allow 127.0.0.1;
        # allow YOUR.MONITOR.IP.HERE;
        # deny  all;
        access_log off;
        proxy_pass http://omen_clinic_agent;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Everything else is closed ────────────────────────────────────────────
    # /simulate is a local test endpoint and is deliberately NOT proxied — reach
    # it only via localhost:3000 on the box. Unknown paths get 444 (connection
    # closed, no response body) to starve scanners.
    location / {
        return 444;
    }
}
